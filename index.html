<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinoTown - NeonSparks</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f1016; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar de Navegación */
        sidebar { width: 250px; background: #161824; border-right: 2px solid #25283d; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .menu-section { margin-bottom: 20px; }
        .menu-title { font-size: 12px; text-transform: uppercase; color: #8a8d9f; margin-bottom: 10px; letter-spacing: 1px; }
        .menu-btn { width: 100%; background: transparent; border: none; color: #c0c2d3; padding: 12px 15px; text-align: left; border-radius: 8px; cursor: pointer; font-size: 15px; margin-bottom: 5px; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .menu-btn:hover, .menu-btn.active { background: #00ffcc22; color: #00ffcc; border-left: 4px solid #00ffcc; }
        
        /* Panel de Usuario */
        .user-card { background: #1f2233; padding: 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
        .avatar-mini { width: 40px; height: 40px; background: #00ffcc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0f1016; box-shadow: 0 0 8px #00ffcc; }
        .user-info h4 { font-size: 14px; }
        .user-info p { font-size: 12px; color: #00ffcc; }

        /* Área Principal del Juego */
        main { flex: 1; display: flex; flex-direction: column; position: relative; }
        header { height: 60px; background: #161824; border-bottom: 2px solid #25283d; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; }
        .room-title h2 { font-size: 18px; color: #fff; }
        .room-title p { font-size: 12px; color: #8a8d9f; }
        .stats-badge { background: #1f2233; padding: 6px 14px; border-radius: 20px; font-size: 14px; color: #ffd700; border: 1px solid #333852; }

        /* Lienzo del Mundo (Canvas) */
        .game-container { flex: 1; position: relative; background: radial-gradient(circle at center, #1b1e2e 0%, #0d0e15 100%); display: flex; justify-content: center; align-items: center; }
        canvas { background: #13151f; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #25283d; }
        
        /* Controles y Ayuda Flotante */
        .hud-overlay { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(22, 24, 36, 0.85); padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #a0a3b8; border: 1px solid #2a2e45; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <sidebar>
        <div>
            <div class="logo">⚡ TinoTown</div>
            
            <div class="menu-section">
                <div class="menu-title">Salas</div>
                <button class="menu-btn active" onclick="switchRoom('Plaza')">🏙️ Plaza Central</button>
                <button class="menu-btn" onclick="switchRoom('Arcade')">🕹️ Arcade (Minijuegos)</button>
                <button class="menu-btn" onclick="switchRoom('Tienda')">👕 Tienda de Ropa</button>
                <button class="menu-btn" onclick="switchRoom('Iglú')">🏠 Mi Iglú</button>
            </div>
            
            <div class="menu-section">
                <div class="menu-title">Social</div>
                <button class="menu-btn" onclick="alert('¡Próximamente sistema de amigos online!')">👥 Amigos</button>
                <button class="menu-btn" onclick="alert('Escribe en el chat con la tecla Enter dentro del juego')">💬 Chat Global</button>
            </div>
        </div>

        <div class="user-card">
            <div class="avatar-mini">S</div>
            <div class="user-info">
                <h4>Santino</h4>
                <p id="coins-display">🪙 250 TinoCoins</p>
            </div>
        </div>
    </sidebar>

    <!-- MAIN APP -->
    <main>
        <header>
            <div class="room-title">
                <h2 id="current-room-name">Plaza Central</h2>
                <p>Punto de encuentro de los NeonSparks</p>
            </div>
            <div class="stats-badge" id="room-status">Estado: En línea 🟢</div>
        </header>

        <div class="game-container">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <div class="hud-overlay">Usa <b>WASD</b> o <b>Flechas</b> para moverte • Presiona <b>Enter</b> para hablar</div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Estado del jugador (NeonSpark)
        let player = {
            x: 400,
            y: 250,
            size: 24,
            speed: 3.5,
            color: '#00ffcc',
            name: 'Santino',
            message: '',
            msgTimer: 0
        };

        // Bot NPC para dar vida al mundo
        let npc = {
            x: 200,
            y: 150,
            size: 24,
            color: '#ff0055',
            name: 'TinoBot 🤖',
            message: '¡Bienvenidos a TinoTown!',
            vx: 1,
            vy: 0.5
        };

        let keys = {};
        let currentRoom = 'Plaza';
        let coins = 250;

        // Escuchar teclado
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'Enter') {
                let msg = prompt('¿Qué querés decir en el chat?');
                if (msg) {
                    player.message = msg;
                    player.msgTimer = 300; // Dura 300 frames
                }
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function switchRoom(room) {
            currentRoom = room;
            document.getElementById('current-room-name').innerText = room === 'Plaza' ? 'Plaza Central' : room === 'Arcade' ? 'Salón Arcade' : room === 'Tienda' ? 'Tienda de Hoodies' : 'Mi Iglú Personal';
            
            // Actualizar botones activos
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Bucle principal del juego
        function update() {
            // Movimiento del jugador
            if (keys['w'] || keys['arrowup']) player.y -= player.speed;
            if (keys['s'] || keys['arrowdown']) player.y += player.speed;
            if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
            if (keys['d'] || keys['arrowright']) player.x += player.speed;

            // Limites del mapa
            player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
            player.y = Math.max(30, Math.min(canvas.height - 30, player.y));

            // Movimiento simple del NPC Bot
            npc.x += npc.vx;
            npc.y += npc.vy;
            if (npc.x < 50 || npc.x > canvas.width - 50) npc.vx *= -1;
            if (npc.y < 50 || npc.y > canvas.height - 50) npc.vy *= -1;

            if (player.msgTimer > 0) player.msgTimer--;
        }

        function draw() {
            // Limpiar pantalla
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar elementos según la sala
            if (currentRoom === 'Plaza') {
                // Suelo de plaza con adoquines simulados
                ctx.strokeStyle = '#1f2233';
                ctx.lineWidth = 1;
                for(let i=0; i<canvas.width; i+=40) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
                }

                // Fuente central decorativa
                ctx.fillStyle = '#161824';
                ctx.beginPath(); ctx.arc(400, 250, 50, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.stroke();
            } else if (currentRoom === 'Arcade') {
                ctx.fillStyle = '#ff005522';
                ctx.fillRect(100, 100, 120, 80);
                ctx.fillStyle = '#ff0055';
                ctx.font = '14px sans-serif';
                ctx.fillText('🕹️ Maquinita Arcade', 105, 145);
            }

            // Dibujar NPC Bot
            drawNeonSpark(npc.x, npc.y, npc.color, npc.name, npc.message);

            // Dibujar Jugador (Santino)
            drawNeonSpark(player.x, player.y, player.color, player.name, player.msgTimer > 0 ? player.message : null);
        }

        function drawNeonSpark(x, y, color, name, message) {
            // Estela / Sombra de neón
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;

            // Cuerpo (Sudadera con capucha)
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.fill();

            // Visor LED de la cara
            ctx.fillStyle = '#0f1016';
            ctx.fillRect(x - 8, y - 4, 16, 8);

            ctx.shadowBlur = 0; // Apagar sombra para texto

            // Nombre del usuario
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(name, x, y - 24);

            // Burbuja de chat si existe mensaje
            if (message) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x - 60, y - 60, 120, 25);
                ctx.strokeStyle = '#25283d';
                ctx.strokeRect(x - 60, y - 60, 120, 25);
                ctx.fillStyle = '#0f1016';
                ctx.font = '11px sans-serif';
                ctx.fillText(message, x, y - 43);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
